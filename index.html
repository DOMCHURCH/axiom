<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AXIOM — Institutional Equity Research</title>
    <meta name="description" content="Institutional-grade equity research on any US stock in under 60 seconds. DCF modeling, Monte Carlo simulation, risk matrix, and BUY/HOLD/SELL recommendations powered by live SEC EDGAR data." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; }
      body {
        background: #050810;
        color: #e2e8f0;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      ::selection { background: #0ea5e930; color: #7dd3fc; }
      ::-webkit-scrollbar { width: 5px; }
      ::-webkit-scrollbar-track { background: #050810; }
      ::-webkit-scrollbar-thumb { background: #1e3a5f; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: #0ea5e960; }
      /* Smooth transitions for interactive elements */
      button, a { transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1); }
      /* Focus visible for accessibility */
      :focus-visible { outline: 2px solid #0ea5e9; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
