<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AXIOM — Best Stocks of the Day</title>
    <meta name="description" content="AXIOM scans the US equity market and ranks the best stocks of the day across technical, fundamental, growth, value, quality and risk factors — then generates a deep AI research note on each. Powered by live market data and SEC EDGAR filings." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; }
      body {
        /* The interactive Bayer-dither WebGL canvas renders over this base. */
        background: #0c0d10;
        color: #ffffff;
        overflow: hidden;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-feature-settings: 'cv05' 1, 'ss01' 1;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      /* Tabular, lining figures everywhere numbers matter — columns of
         financial data align digit-for-digit, the institutional standard. */
      .tnum, table, input, [data-num] { font-variant-numeric: tabular-nums lining-nums; }
      code, kbd, pre, .mono { font-variant-numeric: tabular-nums lining-nums; }
      ::selection { background: rgba(245,165,36,0.28); color: #ffe6b0; }
      ::-webkit-scrollbar { width: 9px; height: 9px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); background-clip: padding-box; }
      * { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.14) transparent; }
      /* Skeleton shimmer + panel rise-in */
      @keyframes ax-shimmer { 0% { opacity: 0.4 } 50% { opacity: 0.75 } 100% { opacity: 0.4 } }
      .ax-shimmer { animation: ax-shimmer 1.4s ease-in-out infinite; border-radius: 10px; }
      @keyframes ax-rise { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: translateY(0) } }
      .ax-rise { animation: ax-rise 0.4s cubic-bezier(0.16,1,0.3,1) both; }
      /* Smooth transitions for interactive elements */
      button, a { transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1); }
      /* Focus visible for accessibility */
      :focus-visible { outline: 2px solid rgba(245,165,36,0.7); outline-offset: 2px; border-radius: 6px; }
      /* Respect reduced-motion — disable parallax, reveals, and long transitions */
      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        *, *::before, *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
